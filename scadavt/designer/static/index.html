<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>SCADAVT Network Designer</title>
<style>
  :root{ --bg:#0f1420; --panel:#171e2e; --ink:#e6ecf5; --muted:#8a9cc0;
         --line:#2b3550; --plc:#3b82f6; --mtu:#ef4444; --router:#f59e0b;
         --switch:#10b981; --accent:#60a5fa; }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header b{font-size:15px;margin-right:6px}
  button{background:#223052;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
  button:hover{background:#2c3e68}
  button.act{background:var(--accent);color:#06101f;border-color:var(--accent);font-weight:600}
  .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
  main{flex:1;display:flex;min-height:0}
  .stage{flex:1;position:relative;min-width:0}
  #canvas{width:100%;height:100%;background:
    radial-gradient(circle at 1px 1px, #1c2740 1px, transparent 0) 0 0/24px 24px var(--bg)}
  #status{position:absolute;left:10px;bottom:10px;background:#0b1120cc;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--muted);pointer-events:none}
  #status b{color:var(--accent)}
  aside{width:320px;background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow:auto}
  aside h3{margin:10px 0 4px;font-size:13px;color:var(--accent)}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
  input,textarea,select{width:100%;background:#0f1726;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px;font:13px monospace}
  textarea{min-height:84px;resize:vertical}
  .node{cursor:grab}
  .node.grabbing{cursor:grabbing}
  .node text{fill:#06101f;font-weight:700;font-size:12px;pointer-events:none}
  .lab{fill:#06101fcc;font-size:10px;pointer-events:none}
  .link{stroke:#5b6b93;stroke-width:2.5}
  .link.p2p{stroke:#f59e0b;stroke-dasharray:5 4}
  .halo{fill:none;stroke:var(--accent);stroke-width:3}
  .rubber{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4;pointer-events:none}
  .legend span{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-size:12px;color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .hint{color:var(--muted);font-size:12px}
  #log{white-space:pre-wrap;font:12px monospace;background:#0b1120;border:1px solid var(--line);border-radius:6px;padding:8px;min-height:60px;max-height:200px;overflow:auto}
</style>
</head>
<body>
<header>
  <b>SCADAVT Designer</b>
  <button data-add="plc">+ PLC</button>
  <button data-add="mtu">+ MTU</button>
  <button data-add="switch">+ Switch</button>
  <button data-add="router">+ Router</button>
  <span class="sep"></span>
  <button id="connectBtn" title="Draw a link between two nodes">🔗 Connect</button>
  <button id="delBtn" title="Delete selected (or press Delete)">🗑 Delete</button>
  <span class="sep"></span>
  <button id="importBtn">Import</button>
  <button id="exportBtn">Export</button>
  <button id="validateBtn">Validate</button>
  <button id="runBtn" class="act">▶ Run</button>
  <span style="flex:1"></span>
  <button id="helpBtn" title="Open the full guide in a new tab">? Tutorial</button>
  <input id="file" type="file" accept=".json,.yaml,.yml" hidden>
</header>
<main>
  <div class="stage">
    <svg id="canvas"></svg>
    <div id="status">Mode: <b id="mode">Select</b> — drag nodes to move; click <b>🔗 Connect</b> to wire them.</div>
  </div>
  <aside>
    <div class="legend">
      <span><i class="dot" style="background:var(--plc)"></i>PLC</span>
      <span><i class="dot" style="background:var(--mtu)"></i>MTU</span>
      <span><i class="dot" style="background:var(--router)"></i>Router</span>
      <span><i class="dot" style="background:var(--switch)"></i>Switch</span>
    </div>
    <h3>Properties</h3>
    <div id="props"><p class="hint">Click a node to edit its id / IP / seed.</p></div>
    <h3>Rules (cross-PLC control)</h3>
    <p class="hint">One per line: <code>S1 &lt; 3 =&gt; A2 open</code> — PLC1's low sensor opens PLC2's actuator.</p>
    <textarea id="rules" placeholder="S1 < 3 => A2 open"></textarea>
    <button id="applyRules">Apply rules</button>
    <h3>Server</h3>
    <label>Service base (blank = same origin)</label>
    <input id="base" value="">
    <label>Auth token (only if the service was started with one)</label>
    <input id="token" placeholder="(none for local)">
    <h3>Output</h3>
    <div id="log"></div>
  </aside>
</main>

<script src="designer.js"></script>
</body>
</html>
