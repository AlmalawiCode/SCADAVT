[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scadavt"
version = "2.0.0"
description = "SCADAVT: an open SCADA security testbed with an EPANET water-distribution plant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abdulmohsen Almalawi"}]
dependencies = [
  "owa-epanet>=2.3",
  "pymodbus>=3.8,<3.9",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["scadavt*"]

[tool.setuptools.package-data]
"scadavt.scenarios.town" = ["*.inp", "*.yaml"]
